<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Error KB</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f11;
    --surface: #13161a;
    --surface2: #1a1e24;
    --border: #252b33;
    --border2: #2f3740;
    --text: #e8ecf0;
    --muted: #6b7785;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --purple: #a855f7;
    --purple-dim: rgba(168,85,247,0.12);
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    height: 60px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
  }
  .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .logo span { color: var(--muted); }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #totalCount {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Layout ── */
  .container { max-width: 960px; margin: 0 auto; padding: 2rem; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 9px 12px 9px 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); }

  select {
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .btn-danger {
    background: transparent;
    color: var(--red);
    border-color: var(--red-dim);
  }
  .btn-danger:hover { background: var(--red-dim); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 1px;
    margin-bottom: 1.5rem;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat-item {
    flex: 1;
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-item:first-child { border-radius: 10px 0 0 10px; }
  .stat-item:last-child { border-radius: 0 10px 10px 0; }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    line-height: 1;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-red .stat-num { color: var(--red); }
  .stat-amber .stat-num { color: var(--amber); }
  .stat-green .stat-num { color: var(--green); }
  .stat-blue .stat-num { color: var(--accent); }

  /* ── Cards ── */
  #cardList { display: flex; flex-direction: column; gap: 10px; }

  .kb-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    transition: border-color 0.15s;
    animation: fadeIn 0.2s ease;
  }
  .kb-card:hover { border-color: var(--border2); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .card-title {
    font-weight: 600;
    font-size: 15px;
    flex: 1;
    min-width: 200px;
    line-height: 1.4;
  }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .badge-red    { background: var(--red-dim);    color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
  .badge-amber  { background: var(--amber-dim);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
  .badge-green  { background: var(--green-dim);  color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
  .badge-blue   { background: var(--accent-dim); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); }
  .badge-purple { background: var(--purple-dim); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.25); }
  .badge-gray   { background: rgba(107,119,133,0.15); color: var(--muted); border: 1px solid rgba(107,119,133,0.25); }

  .card-error {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--red);
    background: var(--red-dim);
    border: 1px solid rgba(239,68,68,0.15);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 10px;
    word-break: break-all;
  }

  .card-fields { display: grid; gap: 8px; margin-bottom: 12px; }
  .field-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; }
  .field-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 1px;
  }
  .field-val { font-size: 13px; color: var(--text); line-height: 1.5; }

  .tags-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 7px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .card-actions { display: flex; gap: 6px; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-state .big { font-family: var(--font-mono); font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 1rem;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    width: 100%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.75rem;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .modal-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-title svg { color: var(--accent); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--accent); }
  .form-group input::placeholder,
  .form-group textarea::placeholder { color: var(--muted); }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
  }

  /* ── Highlight ── */
  .hl { background: rgba(245,158,11,0.3); color: var(--amber); border-radius: 2px; padding: 0 2px; }

  /* ── Confirm Dialog ── */
  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--red-dim);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .confirm-box h4 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }

  /* ── Scrollbar ── */
  .hl { background: rgba(245,158,11,0.3); color: var(--amber); border-radius: 2px; padding: 0 2px; }
  .resolution-val { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; max-height: 140px; overflow-y: auto; font-size: 12px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }

  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 600px) {
    .container { padding: 1rem; }
    header { padding: 0 1rem; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-bar { display: grid; grid-template-columns: 1fr 1fr; }
    .stat-item:first-child { border-radius: 10px 0 0 0; }
    .stat-item:last-child { border-radius: 0 0 10px 0; }
    .stat-item:nth-child(2) { border-radius: 0 10px 0 0; }
    .stat-item:nth-child(3) { border-radius: 0 0 0 10px; }
    .field-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">DEPLOY<span>/</span>KB</div>
  <div class="header-right">
    <span id="totalCount"></span>
    <button class="btn btn-primary" onclick="openAdd()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Entry
    </button>
  </div>
</header>

<div class="container">

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item stat-blue"><span class="stat-num" id="sCrit">0</span><span class="stat-label">Critical</span></div>
    <div class="stat-item stat-amber"><span class="stat-num" id="sOpen">0</span><span class="stat-label">Open</span></div>
    <div class="stat-item stat-green"><span class="stat-num" id="sResolved">0</span><span class="stat-label">Resolved</span></div>
    <div class="stat-item stat-red"><span class="stat-num" id="sTotal">0</span><span class="stat-label">Total</span></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search errors, tags, resolution..." oninput="render()">
    </div>
    <select id="sevFilter" onchange="render()">
      <option value="">All Severities</option>
      <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
    </select>
    <select id="statusFilter" onchange="render()">
      <option value="">All Statuses</option>
      <option>Open</option><option>In Progress</option><option>Resolved</option>
    </select>
    <select id="envFilter" onchange="render()">
      <option value="">All Environments</option>
      <option>Production</option><option>Staging</option><option>Dev</option>
    </select>
  </div>

  <div id="cardList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="overlayClick(event)">
  <div class="modal" id="modalBox">
    <div class="modal-title">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="modalIcon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      <span id="modalTitle">New Entry</span>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Title *</label>
        <input type="text" id="fTitle" placeholder="e.g. OOMKilled: container exits with code 137">
      </div>
      <div class="form-group full">
        <label>Error Message *</label>
        <input type="text" id="fError" placeholder="Paste exact error or exit code">
      </div>
      <div class="form-group">
        <label>Severity</label>
        <select id="fSev">
          <option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option>Open</option><option>In Progress</option><option>Resolved</option>
        </select>
      </div>
      <div class="form-group">
        <label>Environment</label>
        <select id="fEnv">
          <option>Production</option><option>Staging</option><option selected>Dev</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="fTags" placeholder="kubernetes, nginx, postgres">
      </div>
      <div class="form-group full">
        <label>Root Cause</label>
        <textarea id="fRoot" placeholder="What caused this error?"></textarea>
      </div>
      <div class="form-group full">
        <label>Resolution Steps</label>
        <textarea id="fRes" placeholder="Step-by-step fix applied..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRecord()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Save Entry
      </button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="modal-overlay" id="confirmOverlay" style="display:none">
  <div class="confirm-box">
    <h4>Delete this entry?</h4>
    <p>This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ── Firebase config ────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:      "AIzaSyAtCcRTHKYwHK9MHvddGV3_p4hBEVwL8Cs",
  authDomain:  "deployment-errors-guide.firebaseapp.com",
  databaseURL: "https://deployment-errors-guide-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:   "deployment-errors-guide"
});
const db = firebase.database();

// ── State ──────────────────────────────────────────────────────────────────────
let records   = {};
let editingId = null;
let deleteId  = null;

// ── Live listener — auto-updates for ALL users in real time ───────────────────
db.ref('entries').on('value', function(snapshot) {
  records = snapshot.val() || {};
  render();
}, function(err) {
  console.error('Firebase error:', err.message);
});

// ── Helpers ────────────────────────────────────────────────────────────────────
const sevBadge  = s => ({ Critical:'badge-red', High:'badge-amber', Medium:'badge-blue', Low:'badge-gray' })[s] || 'badge-gray';
const statBadge = s => ({ Resolved:'badge-green', Open:'badge-red', 'In Progress':'badge-amber' })[s] || 'badge-gray';
const envBadge  = e => ({ Production:'badge-purple', Staging:'badge-amber', Dev:'badge-blue' })[e] || 'badge-gray';

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const safe = esc(text);
  const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(`(${safeQ})`, 'gi'), '<span class="hl">$1</span>');
}

function getFiltered() {
  const q  = document.getElementById('searchInput').value.trim().toLowerCase();
  const sv = document.getElementById('sevFilter').value;
  const st = document.getElementById('statusFilter').value;
  const ev = document.getElementById('envFilter').value;
  const all = Object.keys(records).map(id => Object.assign({ _id: id }, records[id]));
  return all.filter(r => {
    if (sv && r.severity !== sv) return false;
    if (st && r.status   !== st) return false;
    if (ev && r.env      !== ev) return false;
    if (q) {
      const hay = [r.title, r.error, r.root, r.resolution, r.tags||''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
}

function updateStats() {
  const all = Object.values(records);
  document.getElementById('sCrit').textContent     = all.filter(r=>r.severity==='Critical').length;
  document.getElementById('sOpen').textContent     = all.filter(r=>r.status==='Open').length;
  document.getElementById('sResolved').textContent = all.filter(r=>r.status==='Resolved').length;
  document.getElementById('sTotal').textContent    = all.length;
  document.getElementById('totalCount').textContent = all.length + ' entr' + (all.length===1?'y':'ies');
}

function render() {
  updateStats();
  const q = document.getElementById('searchInput').value.trim();
  const items = getFiltered();
  const list = document.getElementById('cardList');

  if (!items.length) {
    list.innerHTML = `<div class="empty-state"><div class="big">{'}'}</div><p>${q ? 'No records match <strong>' + esc(q) + '</strong>' : 'No entries yet. Add your first deployment error.'}</p></div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const tagArr = r.tags ? r.tags.split(',').map(t=>t.trim()).filter(Boolean) : [];
    const tags = tagArr.map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
    return `
    <div class="kb-card">
      <div class="card-header">
        <div class="card-title">${highlight(r.title, q)}</div>
        <div class="card-badges">
          <span class="badge ${sevBadge(r.severity)}">${esc(r.severity)}</span>
          <span class="badge ${statBadge(r.status)}">${esc(r.status)}</span>
          <span class="badge ${envBadge(r.env)}">${esc(r.env)}</span>
        </div>
      </div>
      <div class="card-error">${highlight(r.error, q)}</div>
      <div class="card-fields">
        ${r.root ? `<div class="field-row"><span class="field-label">Root Cause</span><span class="field-val">${highlight(r.root, q)}</span></div>` : ''}
        ${r.resolution ? `<div class="field-row"><span class="field-label">Resolution</span><div class="field-val resolution-val">${highlight(r.resolution, q)}</div></div>` : ''}
        ${tags ? `<div class="field-row"><span class="field-label">Tags</span><div class="tags-row">${tags}</div></div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-date">${esc(r.date||'')}</span>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${esc(r._id)}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            Edit
          </button>
          <button class="btn btn-danger btn-sm" onclick="askDelete('${esc(r._id)}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            Delete
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Add / Edit ─────────────────────────────────────────────────────────────────
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Entry';
  clearForm();
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('fTitle').focus();
}

function openEdit(id) {
  editingId = id;
  const r = records[id];
  if (!r) return;
  document.getElementById('modalTitle').textContent = 'Edit Entry';
  document.getElementById('fTitle').value  = r.title      || '';
  document.getElementById('fError').value  = r.error      || '';
  document.getElementById('fSev').value    = r.severity   || 'Medium';
  document.getElementById('fStatus').value = r.status     || 'Open';
  document.getElementById('fEnv').value    = r.env        || 'Dev';
  document.getElementById('fTags').value   = r.tags       || '';
  document.getElementById('fRoot').value   = r.root       || '';
  document.getElementById('fRes').value    = r.resolution || '';
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('fTitle').focus();
}

function clearForm() {
  ['fTitle','fError','fTags','fRoot','fRes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSev').value    = 'Medium';
  document.getElementById('fStatus').value = 'Open';
  document.getElementById('fEnv').value    = 'Dev';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  editingId = null;
}

function overlayClick(e) {
  if (e.target.id === 'modalOverlay') closeModal();
}

function saveRecord() {
  const title = document.getElementById('fTitle').value.trim();
  const error = document.getElementById('fError').value.trim();
  if (!title) { document.getElementById('fTitle').focus(); alert('Title is required.'); return; }
  if (!error) { document.getElementById('fError').focus(); alert('Error message is required.'); return; }

  const rec = {
    title,
    error,
    severity:   document.getElementById('fSev').value,
    status:     document.getElementById('fStatus').value,
    env:        document.getElementById('fEnv').value,
    tags:       document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean).join(','),
    root:       document.getElementById('fRoot').value.trim(),
    resolution: document.getElementById('fRes').value.trim(),
    date:       editingId ? (records[editingId]?.date || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
    updatedAt:  Date.now()
  };

  const promise = editingId
    ? db.ref('entries/' + editingId).update(rec)
    : db.ref('entries').push(rec);

  promise
    .then(() => closeModal())
    .catch(err => alert('Save failed: ' + err.message));
}

// ── Delete ─────────────────────────────────────────────────────────────────────
function askDelete(id) {
  deleteId = id;
  document.getElementById('confirmOverlay').style.display = 'flex';
}
function closeConfirm() {
  deleteId = null;
  document.getElementById('confirmOverlay').style.display = 'none';
}
function confirmDelete() {
  db.ref('entries/' + deleteId).remove()
    .then(() => closeConfirm())
    .catch(err => alert('Delete failed: ' + err.message));
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').select();
  }
});
</script>
