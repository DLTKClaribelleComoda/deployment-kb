<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Error KB</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f11; --surface:#13161a; --surface2:#1a1e24;
    --border:#252b33; --border2:#2f3740;
    --text:#e8ecf0; --muted:#6b7785;
    --accent:#f97316; --accent-dim:rgba(249,115,22,0.12);
    --red:#ef4444; --red-dim:rgba(239,68,68,0.12);
    --amber:#f59e0b; --amber-dim:rgba(245,158,11,0.12);
    --green:#22c55e; --green-dim:rgba(34,197,94,0.12);
    --blue:#3b82f6; --blue-dim:rgba(59,130,246,0.12);
    --purple:#a855f7; --purple-dim:rgba(168,85,247,0.12);
    --font-mono:'IBM Plex Mono',monospace;
    --font-sans:'IBM Plex Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

  /* ── Setup Screen ── */
  #setupScreen{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:2rem;
  }
  .setup-card{
    background:var(--surface);border:1px solid var(--border2);
    border-radius:16px;padding:2.5rem;width:100%;max-width:520px;
  }
  .setup-logo{
    font-family:var(--font-mono);font-size:13px;font-weight:600;
    color:var(--accent);letter-spacing:0.08em;margin-bottom:1.75rem;
    display:flex;align-items:center;gap:8px;
  }
  .setup-logo::before{
    content:'';display:block;width:8px;height:8px;
    border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .setup-card h2{font-size:20px;font-weight:600;margin-bottom:6px}
  .setup-card p{font-size:13px;color:var(--muted);margin-bottom:1.75rem;line-height:1.6}
  .setup-steps{display:flex;flex-direction:column;gap:14px;margin-bottom:1.75rem}
  .setup-step{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--surface2);border-radius:10px;padding:12px 14px;
    border:1px solid var(--border);
  }
  .step-num{
    font-family:var(--font-mono);font-size:11px;font-weight:600;
    color:var(--accent);background:var(--accent-dim);
    border:1px solid rgba(249,115,22,0.3);
    border-radius:4px;padding:1px 7px;white-space:nowrap;margin-top:1px;
  }
  .step-body{font-size:13px;color:var(--muted);line-height:1.6}
  .step-body strong{color:var(--text);font-weight:500}
  .step-body code{
    font-family:var(--font-mono);font-size:11px;
    background:var(--border);border-radius:4px;padding:1px 5px;color:var(--accent);
  }
  .setup-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}
  .setup-field label{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
  .setup-field input{
    width:100%;padding:9px 12px;background:var(--surface2);
    border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;
    transition:border-color .15s;
  }
  .setup-field input:focus{border-color:var(--accent)}
  .setup-field input::placeholder{color:var(--muted)}
  .setup-error{font-size:12px;color:var(--red);margin-top:-4px;display:none}

  /* ── App (hidden until setup) ── */
  #appScreen{display:block}

  /* ── Header ── */
  header{
    border-bottom:1px solid var(--border);padding:0 2rem;
    display:flex;align-items:center;gap:1rem;height:58px;
    position:sticky;top:0;background:var(--bg);z-index:50;
  }
  .logo{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:0.08em;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .live-badge{
    font-family:var(--font-mono);font-size:10px;font-weight:600;
    padding:2px 8px;border-radius:99px;letter-spacing:0.05em;
    display:flex;align-items:center;gap:5px;
  }
  .live-badge.connected{background:var(--green-dim);color:#86efac;border:1px solid rgba(34,197,94,0.25)}
  .live-badge.connecting{background:var(--amber-dim);color:#fcd34d;border:1px solid rgba(245,158,11,0.25)}
  .live-badge.disconnected{background:var(--red-dim);color:#fca5a5;border:1px solid rgba(239,68,68,0.25)}
  .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  #totalCount{font-family:var(--font-mono);font-size:11px;color:var(--muted)}

  /* ── Layout ── */
  .container{max-width:980px;margin:0 auto;padding:2rem}

  /* ── Stats ── */
  .stats-bar{display:flex;gap:1px;margin-bottom:1.5rem;background:var(--border);border-radius:10px;overflow:hidden}
  .stat-item{flex:1;background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;transition:background .15s}
  .stat-item:first-child{border-radius:10px 0 0 10px}
  .stat-item:last-child{border-radius:0 10px 10px 0}
  .stat-num{font-family:var(--font-mono);font-size:22px;font-weight:600;line-height:1;transition:all .3s}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em}
  .s-critical .stat-num{color:var(--red)}
  .s-open     .stat-num{color:var(--amber)}
  .s-resolved .stat-num{color:var(--green)}
  .s-total    .stat-num{color:var(--accent)}

  /* ── Toolbar ── */
  .toolbar{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  #searchInput{
    width:100%;padding:9px 12px 9px 38px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;transition:border-color .15s;
  }
  #searchInput:focus{border-color:var(--accent)}
  #searchInput::placeholder{color:var(--muted)}
  select{
    padding:9px 12px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-family:var(--font-sans);font-size:13px;
    outline:none;cursor:pointer;transition:border-color .15s;
  }
  select:focus{border-color:var(--accent)}
  select option{background:var(--surface2)}

  /* ── Buttons ── */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:#ea6c0a}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
  .btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
  .btn-danger{background:transparent;color:var(--red);border-color:var(--red-dim)}
  .btn-danger:hover{background:var(--red-dim)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-settings{padding:7px 10px;font-size:12px;border-color:var(--border)}
  button:disabled{opacity:0.5;cursor:not-allowed}

  /* ── Cards ── */
  #cardList{display:flex;flex-direction:column;gap:10px}
  .kb-card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:1.25rem;transition:border-color .15s, transform .15s;
    animation:fadeIn .25s ease;
  }
  .kb-card:hover{border-color:var(--border2)}
  .kb-card.new-flash{animation:newFlash .6s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes newFlash{0%{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}100%{border-color:var(--border);box-shadow:none}}
  .card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .card-title{font-weight:600;font-size:15px;flex:1;min-width:180px;line-height:1.4}
  .card-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .badge{font-family:var(--font-mono);font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;letter-spacing:0.02em}
  .badge-red   {background:var(--red-dim);   color:#fca5a5;border:1px solid rgba(239,68,68,0.25)}
  .badge-amber {background:var(--amber-dim); color:#fcd34d;border:1px solid rgba(245,158,11,0.25)}
  .badge-green {background:var(--green-dim); color:#86efac;border:1px solid rgba(34,197,94,0.25)}
  .badge-blue  {background:var(--blue-dim);  color:#93c5fd;border:1px solid rgba(59,130,246,0.25)}
  .badge-purple{background:var(--purple-dim);color:#d8b4fe;border:1px solid rgba(168,85,247,0.25)}
  .badge-orange{background:var(--accent-dim);color:#fdba74;border:1px solid rgba(249,115,22,0.25)}
  .badge-gray  {background:rgba(107,119,133,0.15);color:var(--muted);border:1px solid rgba(107,119,133,0.25)}
  .card-error{
    font-family:var(--font-mono);font-size:12px;color:var(--red);
    background:var(--red-dim);border:1px solid rgba(239,68,68,0.15);
    border-radius:6px;padding:6px 10px;margin-bottom:10px;
    word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere;
    max-height:100px;overflow-y:auto;
  }
  .card-fields{display:grid;gap:8px;margin-bottom:12px}
  .field-row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}
  .field-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;padding-top:1px}
  .field-val{font-size:13px;color:var(--text);line-height:1.5;word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere}
  .resolution-val{
    background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;padding:8px 10px;
    max-height:140px;overflow-y:auto;
    font-size:12px;line-height:1.6;
  }
  .tags-row{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 7px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px}
  .card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-date{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  .card-author{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .card-actions{display:flex;gap:6px}

  /* ── Empty / Loading ── */
  .empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}
  .empty-state .big{font-family:var(--font-mono);font-size:3rem;margin-bottom:1rem;opacity:0.25}
  .spinner-wrap{text-align:center;padding:3rem;color:var(--muted);font-family:var(--font-mono);font-size:13px}
  .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;backdrop-filter:blur(4px)}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;padding:1.75rem;animation:modalIn .2s ease}
  @keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
  .modal-title{font-size:17px;font-weight:600;margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
  .modal-title .icon{color:var(--accent)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  .form-group{display:flex;flex-direction:column;gap:5px}
  .form-group label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
  .form-group input,.form-group textarea,.form-group select{
    width:100%;padding:9px 12px;background:var(--surface2);
    border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-sans);font-size:13px;outline:none;transition:border-color .15s;
  }
  .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
  .form-group input::placeholder,.form-group textarea::placeholder{color:var(--muted)}
  .form-group textarea{resize:vertical;min-height:80px;line-height:1.5}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}

  /* ── Confirm ── */
  .confirm-box{background:var(--surface);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:1.5rem;max-width:360px;width:100%;text-align:center}
  .confirm-box h4{font-size:16px;font-weight:600;margin-bottom:8px}
  .confirm-box p{font-size:13px;color:var(--muted);margin-bottom:1.25rem}
  .confirm-actions{display:flex;gap:10px;justify-content:center}

  /* ── Toast ── */
  #toast{
    position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
    font-family:var(--font-mono);font-size:12px;
    background:var(--surface2);border:1px solid var(--border2);
    border-radius:8px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;
    transform:translateY(80px);opacity:0;transition:all .25s ease;
    pointer-events:none;max-width:320px;
  }
  #toast.show{transform:translateY(0);opacity:1}
  #toast.toast-ok  {border-color:rgba(34,197,94,0.4);color:#86efac}
  #toast.toast-err {border-color:rgba(239,68,68,0.4);color:#fca5a5}
  #toast.toast-info{border-color:rgba(59,130,246,0.4);color:#93c5fd}

  .hl{background:rgba(249,115,22,0.25);color:var(--accent);border-radius:2px;padding:0 2px}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  @media(max-width:620px){
    .container{padding:1rem}
    header{padding:0 1rem}
    .form-grid{grid-template-columns:1fr}
    .stats-bar{display:grid;grid-template-columns:1fr 1fr}
    .stat-item:first-child{border-radius:10px 0 0 0}
    .stat-item:last-child{border-radius:0 0 10px 0}
    .stat-item:nth-child(2){border-radius:0 10px 0 0}
    .stat-item:nth-child(3){border-radius:0 0 0 10px}
    .field-row{grid-template-columns:1fr;gap:2px}
  }
</style>
</head>
<body>



<!-- ══ APP SCREEN ════════════════════════════════════════════════════════════ -->
<div id="appScreen">
  <header>
    <div class="logo"><span class="logo-dot"></span>DEPLOY/KB</div>
    <div id="liveBadge" class="live-badge connecting"><span class="pulse"></span>connecting</div>
    <div class="header-right">
      <span id="totalCount"></span>
      <button class="btn btn-ghost btn-sm btn-settings" onclick="openSettings()" title="Firebase settings">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn btn-primary" onclick="openAdd()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New Entry
      </button>
    </div>
  </header>

  <div class="container">
    <div class="stats-bar">
      <div class="stat-item s-critical"><span class="stat-num" id="sCrit">—</span><span class="stat-label">Critical</span></div>
      <div class="stat-item s-open">    <span class="stat-num" id="sOpen">—</span><span class="stat-label">Open</span></div>
      <div class="stat-item s-resolved"><span class="stat-num" id="sRes">—</span> <span class="stat-label">Resolved</span></div>
      <div class="stat-item s-total">   <span class="stat-num" id="sTot">—</span> <span class="stat-label">Total</span></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search errors, tags, resolution…  (Ctrl+K)" oninput="renderCards()">
      </div>
      <select id="sevFilter"    onchange="renderCards()"><option value="">All Severities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
      <select id="statusFilter" onchange="renderCards()"><option value="">All Statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option></select>
      <select id="envFilter"    onchange="renderCards()"><option value="">All Environments</option><option>Production</option><option>Staging</option><option>Dev</option></select>
    </div>

    <div id="cardList"><div class="spinner-wrap"><span class="spinner"></span>Connecting to Firebase…</div></div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">
      <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      <span id="modalTitle">New Entry</span>
    </div>
    <div class="form-grid">
      <div class="form-group full"><label>Title *</label><input type="text" id="fTitle" placeholder="e.g. OOMKilled: container exits with code 137"></div>
      <div class="form-group full"><label>Error Message *</label><input type="text" id="fError" placeholder="Paste exact error or exit code"></div>
      <div class="form-group"><label>Severity</label>
        <select id="fSev"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      <div class="form-group"><label>Status</label>
        <select id="fStatus"><option>Open</option><option>In Progress</option><option>Resolved</option></select></div>
      <div class="form-group"><label>Environment</label>
        <select id="fEnv"><option>Production</option><option>Staging</option><option selected>Dev</option></select></div>
      <div class="form-group"><label>Tags (comma separated)</label><input type="text" id="fTags" placeholder="kubernetes, nginx, postgres"></div>
      <div class="form-group full"><label>Root Cause</label><textarea id="fRoot" placeholder="What caused this error?"></textarea></div>
      <div class="form-group full"><label>Resolution Steps</label><textarea id="fRes" placeholder="Step-by-step fix applied…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveRecord()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Save Entry
      </button>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div class="modal-overlay" id="confirmOverlay" style="display:none">
  <div class="confirm-box">
    <h4>Delete this entry?</h4>
    <p>Removes it from Firebase for <strong>everyone</strong> on your team instantly.</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, push, set, update, remove }
                                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ─── Hardcoded Firebase config — no setup needed ──────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:      "AIzaSyAtCcRTHKYwHK9MHvddGV3_p4hBEVwL8Cs",
  authDomain:  "deployment-errors-guide.firebaseapp.com",
  databaseURL: "https://deployment-errors-guide-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:   "deployment-errors-guide"
};

// ─── State (on window so both script blocks can access) ──────────────────────
window._state = { db: null, records: {}, editingId: null, deleteId: null };
const _s = window._state;

// ─── Expose firebase methods to non-module globals ────────────────────────────
window._fb = { ref, onValue, push, set, update, remove };

// ─── Boot immediately ─────────────────────────────────────────────────────────
(function boot() {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    _s.db = getDatabase(app);
  } catch(e) {
    showToast('Firebase init failed: ' + e.message, 'err'); return;
  }

  setBadge('connecting');

  onValue(ref(_s.db, 'entries'), snapshot => {
    setBadge('connected');
    _s.records = snapshot.val() || {};
    renderCards();
  }, err => {
    setBadge('disconnected');
    showToast('Firebase error: ' + err.message, 'err');
  });
})();

// ─── Save ─────────────────────────────────────────────────────────────────────
window.saveRecord = async function() {
  const { ref, push, set, update } = window._fb;
  const title = document.getElementById('fTitle').value.trim();
  const error = document.getElementById('fError').value.trim();
  if (!title) { document.getElementById('fTitle').focus(); return; }
  if (!error) { document.getElementById('fError').focus(); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-width:2px"></span> Saving…';

  const rec = {
    title, error,
    severity:   document.getElementById('fSev').value,
    status:     document.getElementById('fStatus').value,
    env:        document.getElementById('fEnv').value,
    tags:       document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean).join(','),
    root:       document.getElementById('fRoot').value.trim(),
    resolution: document.getElementById('fRes').value.trim(),
    date:       _s.editingId ? (_s.records[_s.editingId]?.date || today()) : today(),
    updatedAt:  Date.now()
  };

  try {
    if (_s.editingId) {
      await update(ref(_s.db, 'entries/' + _s.editingId), rec);
      showToast('Entry updated', 'ok');
    } else {
      const newRef = push(ref(_s.db, 'entries'));
      await set(newRef, rec);
      showToast('Entry added', 'ok');
    }
    closeModal();
  } catch(e) {
    showToast('Save failed: ' + e.message, 'err');
  }

  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Save Entry';
};

// ─── Delete ───────────────────────────────────────────────────────────────────
window.confirmDelete = async function() {
  const { ref, remove } = window._fb;
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try {
    await remove(ref(_s.db, 'entries/' + _s.deleteId));
    showToast('Entry deleted', 'ok');
    closeConfirm();
  } catch(e) {
    showToast('Delete failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Delete';
  }
};

// ─── Settings button — no-op now, kept for UI consistency ────────────────────
window.openSettings = function() {
  showToast('Config is hardcoded in this file.', 'info');
};
</script>

<script>
// ─── Helpers ──────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today = () => new Date().toISOString().slice(0,10);

function highlight(text, q) {
  if (!q) return esc(text);
  return esc(text).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<span class="hl">$1</span>');
}

const sevBadge  = s => ({Critical:'badge-red',High:'badge-amber',Medium:'badge-blue',Low:'badge-gray'})[s]||'badge-gray';
const statBadge = s => ({Resolved:'badge-green',Open:'badge-red','In Progress':'badge-amber'})[s]||'badge-gray';
const envBadge  = e => ({Production:'badge-purple',Staging:'badge-orange',Dev:'badge-blue'})[e]||'badge-gray';

function setBadge(state) {
  const el = document.getElementById('liveBadge');
  el.className = 'live-badge ' + state;
  el.innerHTML = `<span class="pulse"></span>${state === 'connected' ? '● live' : state}`;
}

let toastTimer;
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show toast-' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderCards() {
  const q  = document.getElementById('searchInput').value.trim().toLowerCase();
  const sv = document.getElementById('sevFilter').value;
  const st = document.getElementById('statusFilter').value;
  const ev = document.getElementById('envFilter').value;

  const all = Object.entries(_s.records).map(([id, r]) => ({ id, ...r }))
    .sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));

  document.getElementById('sCrit').textContent = all.filter(r=>r.severity==='Critical').length;
  document.getElementById('sOpen').textContent = all.filter(r=>r.status==='Open').length;
  document.getElementById('sRes').textContent  = all.filter(r=>r.status==='Resolved').length;
  document.getElementById('sTot').textContent  = all.length;
  document.getElementById('totalCount').textContent = all.length + ' entr' + (all.length===1?'y':'ies');

  const items = all.filter(r => {
    if (sv && r.severity !== sv) return false;
    if (st && r.status   !== st) return false;
    if (ev && r.env      !== ev) return false;
    if (q) {
      const hay = [r.title, r.error, r.root, r.resolution, r.tags||''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const list = document.getElementById('cardList');
  if (!items.length) {
    list.innerHTML = `<div class="empty-state"><div class="big">{ }</div><p>${q ? 'No records match <strong>'+esc(q)+'</strong>' : 'No entries yet. Click <strong>New Entry</strong> to add the first one.'}</p></div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const tagArr = r.tags ? r.tags.split(',').map(t=>t.trim()).filter(Boolean) : [];
    const tags   = tagArr.map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
    return `
    <div class="kb-card" id="card-${r.id}">
      <div class="card-header">
        <div class="card-title">${highlight(r.title, q)}</div>
        <div class="card-badges">
          <span class="badge ${sevBadge(r.severity)}">${esc(r.severity)}</span>
          <span class="badge ${statBadge(r.status)}">${esc(r.status)}</span>
          <span class="badge ${envBadge(r.env)}">${esc(r.env)}</span>
        </div>
      </div>
      <div class="card-error">${highlight(r.error, q)}</div>
      <div class="card-fields">
        ${r.root       ? `<div class="field-row"><span class="field-label">Root Cause</span><span class="field-val">${highlight(r.root, q)}</span></div>` : ''}
        ${r.resolution ? `<div class="field-row"><span class="field-label">Resolution</span><div class="field-val resolution-val">${highlight(r.resolution, q)}</div></div>` : ''}
        ${tags         ? `<div class="field-row"><span class="field-label">Tags</span><div class="tags-row">${tags}</div></div>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-meta">
          <span class="card-date">${esc(r.date||'')}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${esc(r.id)}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>Edit
          </button>
          <button class="btn btn-danger btn-sm" onclick="askDelete('${esc(r.id)}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Delete
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── Add / Edit ───────────────────────────────────────────────────────────────
function openAdd() {
  _s.editingId = null;
  document.getElementById('modalTitle').textContent = 'New Entry';
  ['fTitle','fError','fTags','fRoot','fRes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fSev').value    = 'Medium';
  document.getElementById('fStatus').value = 'Open';
  document.getElementById('fEnv').value    = 'Dev';
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('fTitle').focus(), 50);
}
window.openAdd = openAdd;

function openEdit(id) {
  const r = _s.records[id];
  if (!r) return;
  _s.editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Entry';
  document.getElementById('fTitle').value  = r.title      ||'';
  document.getElementById('fError').value  = r.error      ||'';
  document.getElementById('fSev').value    = r.severity   ||'Medium';
  document.getElementById('fStatus').value = r.status     ||'Open';
  document.getElementById('fEnv').value    = r.env        ||'Dev';
  document.getElementById('fTags').value   = r.tags       ||'';
  document.getElementById('fRoot').value   = r.root       ||'';
  document.getElementById('fRes').value    = r.resolution ||'';
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('fTitle').focus(), 50);
}
window.openEdit = openEdit;

function closeModal() { document.getElementById('modalOverlay').style.display='none'; editingId=null; }
window.closeModal = closeModal;

// ─── Delete ───────────────────────────────────────────────────────────────────
function askDelete(id) { _s.deleteId=id; document.getElementById('confirmOverlay').style.display='flex'; }
window.askDelete = askDelete;
function closeConfirm() { _s.deleteId=null; document.getElementById('confirmOverlay').style.display='none'; }
window.closeConfirm = closeConfirm;

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeModal(); closeConfirm(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').select();
  }
});
</script>
</body>
